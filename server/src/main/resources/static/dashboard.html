<div id="layout">
  <!-- 왼쪽 사이드 패널. 메뉴는 앞으로 계속 늘어난다 (data-panel = 오른쪽에 표시할 패널 id) -->
  <nav id="sidebar">
    <div class="brand"><svg class="icon"><use href="#i-dashboard"/></svg> 대시보드</div>
    <a href="#" data-panel="overview" class="nav-item active"><svg class="icon"><use href="#i-dashboard"/></svg> 개요</a>
    <a href="#" data-panel="trends" class="nav-item"><svg class="icon"><use href="#i-timeline"/></svg> 촬영 추이</a>
    <a href="#" data-panel="storage" class="nav-item"><svg class="icon"><use href="#i-storage"/></svg> 저장소·작업</a>
    <a href="/" class="nav-item nav-bottom"><svg class="icon"><use href="#i-image"/></svg> 사진으로 돌아가기</a>
  </nav>

  <div id="content">
    <header id="topbar">
      <h1 id="panel-title">개요</h1>
      <span id="updated"></span>
      <button id="refresh-btn" title="새로고침"><svg class="icon"><use href="#i-refresh"/></svg> 새로고침</button>
    </header>

    <div id="error" class="hidden"></div>

    <!-- 개요 -->
    <section id="panel-overview" class="panel">
      <div id="cards" class="card-grid"></div>
      <div class="card wide">
        <div class="card-head">
          <h2>연도별 촬영 수</h2>
          <span class="card-sub">촬영일 기준 · 휴지통·키즈노트 제외</span>
        </div>
        <div id="chart-year" class="chart"></div>
      </div>
    </section>

    <!-- 촬영 추이 -->
    <section id="panel-trends" class="panel hidden">
      <div class="card wide">
        <div class="card-head">
          <h2>촬영 추이</h2>
          <div class="seg" id="unit-seg">
            <button data-unit="year">연도별</button>
            <button data-unit="month" class="active">월별</button>
            <button data-unit="day">일자별</button>
          </div>
        </div>
        <div id="chart-main" class="chart tall"></div>
        <div id="series-info" class="card-sub"></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2>가장 많이 찍은 구간 TOP 10</h2></div>
        <table id="top-table" class="table"></table>
      </div>
    </section>

    <!-- 저장소·작업 -->
    <section id="panel-storage" class="panel hidden">
      <div class="card wide">
        <div class="card-head"><h2>저장소</h2><span class="card-sub" id="storage-root"></span></div>
        <div id="storage-bar" class="bar"><div id="storage-used" class="bar-fill"></div></div>
        <div id="storage-legend" class="card-sub"></div>
      </div>
      <div class="card wide">
        <div class="card-head"><h2>백그라운드 작업</h2><span class="card-sub">썸네일·얼굴·장면 분석 큐</span></div>
        <table id="jobs-table" class="table"></table>
      </div>
    </section>
  </div>
</div>

<div id="login" class="hidden">
  <form id="login-form">
    <h2>Home Photo</h2>
    <input id="key-input" type="password" placeholder="API 키" autocomplete="current-password">
    <button type="submit">접속</button>
    <p id="login-error" class="hidden">키가 올바르지 않습니다.</p>
  </form>
</div>
