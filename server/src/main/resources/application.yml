spring:
  application:
    name: homephoto-server
  # DB 연결(파일 위치·WAL·풀 크기)은 DataSourceConfig가 만든다 — homephoto.db-path가 비었을 때
  # YAML 플레이스홀더 기본값이 먹지 않기 때문. spring.datasource.url을 직접 주면 그 값이 우선한다.
  exposed:
    generate-ddl: false
    show-sql: false
  servlet:
    multipart:
      max-file-size: 5GB
      max-request-size: 5GB

server:
  port: 8080
  shutdown: graceful

logging:
  file:
    # 콘솔과 별개로 파일에도 남긴다 — 서버를 백그라운드로 돌려도 나중에 확인 가능
    name: ./logs/homephoto.log
  logback:
    rollingpolicy:
      max-file-size: 20MB
      max-history: 7
  level:
    com.homephoto: info

homephoto:
  face:
    enabled: true
    # 비우면 models/buffalo_l 또는 서버 계정의 ~/.insightface/models/buffalo_l 사용
    model-dir: ''
  # Google Photos 파생 이미지 게시: 초기값은 비활성. 실제 계정 검증은 별도로 진행한다.
  google-photos:
    enabled: false
    auto-publish-new: false
    include-videos: false
  # 기본은 로컬 검증. 공개 연결은 별도 OAuth 설정과 HTTPS 검증 후 mode=oauth로 활성화한다.
  mcp:
    enabled: false
    mode: local
    base-url: http://localhost:8080
    preview-ttl-seconds: 300
    # token은 HOMEPHOTO_MCP_TOKEN 환경변수로만 주입하고 저장소에 기록하지 않는다.
  # 아래 값들은 기본값일 뿐 — 실제 운영값은 server/config/application.yml(웹 설정 페이지가
  # 저장하는 외부 설정 파일)이 덮어쓴다. 현재 운영 저장소: C:/homePhotoData
  storage-root: ./data
  # 원본만 분리할 때 homephoto.original-storage.root를 전체 경로로 지정한다.
  # 생략하면 기존 storage-root를 사용하며 DB/썸네일/수신 임시 파일은 로컬 설정을 유지한다.
  # 클라이언트가 X-Api-Key 헤더로 보내야 하는 값. 운영 전 반드시 변경
  api-key: dev-key-change-me
  # 이 시간(ms)을 넘는 API 요청은 로그에 WARN "느린 요청"으로 남는다 — 그리드가 느릴 때 원인 확인용
  slow-request-ms: 500
  # 썸네일 생성 동시 스레드 수. 0 = 자동(코어 절반, 최대 4). 최초 임포트 속도를 좌우한다
  thumbnail-threads: 0
  # DB(photos.db)를 둘 폴더. 비우면 저장소 안의 db 폴더. SSD로 분리할 때만 지정한다
  db-path: ''
  # 썸네일을 둘 폴더. 비우면 저장소 안의 thumbs 폴더. SSD로 분리하면 그리드 스크롤이 빨라진다
  thumbs-path: ''
  # 서버 폴더에 동봉한 ffmpeg 사용 (server/tools/ffmpeg.exe) — PATH·winget 비의존
  ffmpeg-path: ./tools/ffmpeg.exe
  # 장면 분석 — Gemini API 또는 로컬 VLM. 연결 설정은 웹의 장면 분석 화면에서 변경.
  # enabled: false여도 CAPTION 작업은 큐에 쌓이며 켜면 처리한다.
  caption:
    enabled: false
    provider: LOCAL
    gemini-model: gemini-2.5-flash
    gemini-api-key-file: ''
    base-url: http://localhost:11434
    model: gemma3:12b
    timeout-seconds: 180
