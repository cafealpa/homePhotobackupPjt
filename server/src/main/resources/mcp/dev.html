<!doctype html>
<html lang="ko">
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>홈 포토 MCP 로컬 테스트</title>
<style>
body{max-width:1000px;margin:40px auto;padding:0 20px;font:16px system-ui;background:#edf3ef;color:#213a2c}
h1{font-size:26px}p{line-height:1.6}form{display:flex;gap:12px;flex-wrap:wrap;padding:20px;background:white;border-radius:16px}
label{display:flex;flex-direction:column;gap:6px}input,button{font:inherit;padding:10px;border:1px solid #bbd1c0;border-radius:8px}
button{align-self:flex-end;background:#235b40;color:white;cursor:pointer}iframe{width:100%;min-height:260px;border:0;border-radius:16px;background:#fff}#status{min-height:26px}
</style>
<h1>홈 포토 · MCP 로컬 테스트</h1>
<p>날짜 검색과 갤러리를 실제 MCP 요청으로 확인하는 개발 화면이에요.<br>ChatGPT 연결을 대신하는 로컬 테스트 화면이며, 토큰은 저장하지 않아요.</p>
<form id="search"><label>MCP 읽기 토큰<input id="token" type="password" autocomplete="off" required minlength="32"></label>
<label>촬영일<input id="date" type="date" required></label><button id="submit">사진 찾기</button></form>
<p id="status" role="status">서버에 설정한 토큰과 촬영일을 입력해 주세요.</p>
<iframe id="gallery" title="홈 포토 갤러리" sandbox="allow-scripts"></iframe>
<script>
(() => {
  const $ = id => document.getElementById(id);
  let id = 0, result = null, protocol = '2025-06-18';
  async function rpc(method, params) {
    const response = await fetch('/mcp', { method:'POST', headers:{ 'Content-Type':'application/json',
      Accept:'application/json, text/event-stream', Authorization:`Bearer ${$('token').value}`, 'MCP-Protocol-Version':protocol },
      body:JSON.stringify({ jsonrpc:'2.0', id:++id, method, params }) });
    if (!response.ok) throw new Error(`MCP 요청 실패 (${response.status}). 토큰과 서버 설정을 확인해 주세요.`);
    const data = await response.json();
    if (data.error) throw new Error(data.error.message);
    return data.result;
  }
  const send = message => $('gallery').contentWindow.postMessage({ jsonrpc:'2.0', ...message }, '*');
  window.addEventListener('message', async event => {
    if (event.source !== $('gallery').contentWindow || event.data?.jsonrpc !== '2.0') return;
    const m = event.data;
    try {
      if (m.method === 'ui/initialize') {
        send({ id:m.id, result:{ protocolVersion:'2026-01-26', hostInfo:{ name:'Home Photo local test', version:'0.1.0' }, hostCapabilities:{ serverTools:{} } } });
      } else if (m.method === 'ui/notifications/initialized' && result) {
        send({ method:'ui/notifications/tool-result', params:result });
      } else if (m.method === 'tools/call' && ['search_photos','get_photo'].includes(m.params?.name)) {
        send({ id:m.id, result:await rpc('tools/call', m.params) });
      } else if (m.method === 'ui/notifications/size-changed') {
        $('gallery').style.height = `${Math.max(260, Math.min(5000, Number(m.params?.height) || 260))}px`;
      }
    } catch (e) { send({ id:m.id, error:{ code:-32603, message:e.message } }); }
  });
  $('search').onsubmit = async event => {
    event.preventDefault(); $('submit').disabled = true; $('status').textContent = '사진을 조회하고 있어요.';
    try {
      const init = await rpc('initialize', { protocolVersion:protocol, capabilities:{}, clientInfo:{ name:'homephoto-local-test', version:'0.1.0' } });
      protocol = init.protocolVersion;
      result = await rpc('tools/call', { name:'search_photos', arguments:{ date:$('date').value, limit:12 } });
      if (result.isError) throw new Error(result.content?.[0]?.text || '검색에 실패했어요.');
      const resource = await rpc('resources/read', { uri:'ui://homephoto/gallery-v1.html' });
      $('gallery').srcdoc = resource.contents[0].text;
      $('status').textContent = 'MCP 검색 결과예요. 사진을 눌러 크게 볼 수 있어요.';
    } catch (e) { $('status').textContent = e.message; }
    finally { $('submit').disabled = false; }
  };
})();
</script>
</html>
